function creaseAxes(n){let a=[];for(let k=3;k<2*n-3;k++){a.push(['V',k]);a.push(['H',k])}for(let k=-n+3;k<n-2;k++)a.push(['D',k]);for(let k=2;k<2*n-3;k++)a.push(['A',k]);return a}
function creaseGeom(p,n){return [26+p[0]*268/(n-1),26+p[1]*268/(n-1)]}
function creaseEnds(a,n){let t=a[0],k=a[1],m=n-1,ps=[];const add=(x,y)=>{if(x>=-1e-7&&x<=m+1e-7&&y>=-1e-7&&y<=m+1e-7&&!ps.some(p=>Math.abs(p[0]-x)+Math.abs(p[1]-y)<1e-6))ps.push([x,y])};if(t==='V'){add(k/2,0);add(k/2,m)}if(t==='H'){add(0,k/2);add(m,k/2)}if(t==='D'){add(0,-k);add(m,m-k);add(k,0);add(m+k,m)}if(t==='A'){add(0,k);add(m,k-m);add(k,0);add(k-m,m)}return ps.slice(0,2).map(p=>creaseGeom(p,n))}
function creaseUI(){const l=current(),s=state,n=l.n;let lines=[];for(let i=0;i<n;i++){let x=26+i*268/(n-1);lines.push(`<line x1="${x}" y1="19" x2="${x}" y2="301" stroke="#426c6c26"/><line x1="19" y1="${x}" x2="301" y2="${x}" stroke="#426c6c26"/>`)}let crease='';if(s.axis){const p=creaseEnds(s.axis,n);if(p.length===2)crease=`<line class="crease-guide" id="selected-crease" x1="${p[0][0]}" y1="${p[0][1]}" x2="${p[1][0]}" y2="${p[1][1]}"/>`}
const targets=l.dst.map((p,i)=>{let[cx,cy]=creaseGeom(p,n);return `<g><circle cx="${cx}" cy="${cy}" r="12.5" fill="none" stroke="#378b85" stroke-width="3.3"/><circle cx="${cx}" cy="${cy}" r="3" fill="#438b85" opacity=".65"/></g>`}).join('');
const paperVeil=`<g id="fold-face" opacity="0" pointer-events="none"></g>`;
const sources=l.src.map((p,i)=>{let[cx,cy]=creaseGeom(p,n);return `<g data-src="${i}" class="crease-result"><circle class="crease-source" cx="${cx}" cy="${cy}" r="11.5" fill="#d9a46e" stroke="#ffedc8" stroke-width="2.2"/><circle cx="${cx-2.5}" cy="${cy-3.5}" r="3.3" fill="#fff3df" opacity=".65"/></g>`}).join('');
return `<div class="crease-head"><span class="dot-key"><i></i>動く点</span><span class="dot-key target"><i></i>重ねたい場所</span></div><div class="crease-surface" id="crease-surface" role="group" aria-label="紙の上に指で折り線を引く"><svg viewBox="0 0 320 320"><defs><linearGradient id="paperTone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf1e6"/><stop offset="1" stop-color="#d3e0d5"/></linearGradient></defs><rect width="320" height="320" fill="url(#paperTone)"/><rect x="20" y="20" width="280" height="280" fill="#ffffff25" stroke="#547e783d" stroke-width="2" rx="5"/>${lines.join('')}${paperVeil}${targets}${sources}${crease}<line id="raw-draw" x1="0" y1="0" x2="0" y2="0" stroke="#6e896e" stroke-width="2.7" stroke-dasharray="4 5" style="display:none"/></svg><div class="draw-tip">${s.axis?'この線で折る？': '指で紙に折り線を引こう'}</div></div><div class="crease-info"><span>${l.src.length} 個の点を、同時に重ねる</span><strong>${s.axis?'折り線を選択中':'まず折り線を描く'}</strong></div><div class="game-note">${s.axis?'「この線で折る」で答え合わせ':'折る前に、どこへ点が動くか考えてみよう'}</div>`}
function creaseNearest(p,q,n){let delta=Math.hypot(q[0]-p[0],q[1]-p[1]);if(delta<.44)return null;let best=null,bestScore=Infinity;for(let axis of creaseAxes(n)){const v=(pt)=>{const[x,y]=pt,[t,k]=axis;return t==='V'?x-k/2:t==='H'?y-k/2:t==='D'?(x-y-k)/Math.SQRT2:(x+y-k)/Math.SQRT2};let v0=v(p),v1=v(q);let score=(v0*v0+v1*v1)/2;const mid=((v0+v1)/2);score+=mid*mid*.32; // favor lines actually traced
if(score<bestScore){bestScore=score;best=axis}}
return best}
function creaseSolved(l,a){if(!a)return false;let src=l.src,goals=new Set(l.dst.map(p=>p.join(',')));let signs=src.map(p=>Math.sign(creaseSide(p,a))).filter(Boolean);if(signs.length!==src.length||!signs.every(x=>x===signs[0]))return false;return src.every(p=>goals.has(reflectPoint(p,a).join(',')))}
// A true fold, shown as a paper half compressing along the crease and opening over the other half.
function creasePolygon(l,a,sign){let m=l.n-1,points=[[0,0],[m,0],[m,m],[0,m]],out=[];for(let j=0;j<points.length;j++){let x=points[j],y=points[(j+1)%points.length],sx=creaseSide(x,a)*sign,sy=creaseSide(y,a)*sign;if(sx>=0)out.push(x);if((sx>0&&sy<0)||(sx<0&&sy>0)){let t=sx/(sx-sy);out.push([x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t])}}return out.map(p=>creaseGeom(p,l.n).join(',')).join(' ')}
function creaseMatrix(a,n){let [t,k]=a,scale=268/(n-1),origin=26;let matrices={V:[-1,0,0,1,((k)*scale+2*origin),0],H:[1,0,0,-1,0,((k)*scale+2*origin)],D:[0,1,1,0,k*scale,-k*scale],A:[0,-1,-1,0,k*scale+2*origin,k*scale+2*origin]};return matrices[t]}
function animatePaperFold(a,l,sign,token){let face=app.querySelector('#fold-face');if(!face)return;face.innerHTML=`<polygon points="${creasePolygon(l,a,sign)}" fill="#fffbef" stroke="#e4cfab" stroke-width="2.3"/>`;face.setAttribute('opacity','.45');let target=creaseMatrix(a,l.n),begin=[1,0,0,1,0,0],t0=performance.now();function tick(now){if(token!==epoch||!face.isConnected)return;let f=Math.min(1,(now-t0)/590),e=f*f*(3-2*f),m=begin.map((x,i)=>x+(target[i]-x)*e);face.setAttribute('transform',`matrix(${m.join(' ')})`);face.setAttribute('opacity',`${.45*(1-.14*f)}`);if(f<1)requestAnimationFrame(tick);else face.setAttribute('opacity','0')}requestAnimationFrame(tick)}
function creaseCheck(){if(busy||!state.axis)return;let l=current(),a=state.axis,s=state;busy=true;s.tries++;const signs=l.src.map(p=>Math.sign(creaseSide(p,a)));let foldSign=signs.reduce((a,b)=>a+b,0)>=0?1:-1;const success=creaseSolved(l,a),token=epoch;animatePaperFold(a,l,foldSign,token);const nodes=app.querySelectorAll('.crease-result');nodes.forEach((el,i)=>{let p=l.src[i];if(creaseSide(p,a)*foldSign<=0)return;let q=reflectPoint(p,a);let [x,y]=creaseGeom(p,l.n),[xx,yy]=creaseGeom(q,l.n);el.style.transform=`translate(${xx-x}px,${yy-y}px)`});sfx('fold');setTimeout(()=>{if(token!==epoch||state!==s)return;if(success){celebrate(420)}else{busy=false;sfx('no');toast('まだ合わない。折り線を変えてみよう');nodes.forEach(el=>el.style.transform='translate(0,0)')}},750)}
function creaseCoord(e,board){let box=board.getBoundingClientRect(),x=(e.clientX-box.left)/box.width*320,y=(e.clientY-box.top)/box.height*320,n=current().n;return [(x-26)/268*(n-1),(y-26)/268*(n-1)]}
// ----------------------------------- FOLD BRIDGE -----------------------------------
const DIRPORT=[['N',1,0,-1],['E',2,1,0],['S',4,0,1],['W',8,-1,0]];
function activeTiles(l,mask){const a=l.base.slice();l.flaps.forEach((f,i)=>{if(mask&(1<<i))a[f.dest]=f.on});return a}
function bridgeFlow(l,mask){const ports=activeTiles(l,mask),start=10,end=14;if(!(ports[start]&8)||!(ports[end]&2))return {ok:false,visited:[]};let queue=[start],seen=new Set(queue);for(let i=0;i<queue.length;i++){let at=queue[i],x=at%5,y=Math.floor(at/5);for(const[d,bit,dx,dy]of DIRPORT){let xx=x+dx,yy=y+dy;if(xx<0||xx>=5||yy<0||yy>=5||!(ports[at]&bit))continue;let neighbor=xx+5*yy,reverse=d==='N'?4:d==='S'?1:d==='E'?8:2;if((ports[neighbor]&reverse)&&!seen.has(neighbor)){seen.add(neighbor);queue.push(neighbor)}}}return {ok:seen.has(end),visited:[...seen]}}
function mirrorFlapPorts(mask,hinge){return hinge==='E'||hinge==='W'?(mask&5)|((mask&2)?8:0)|((mask&8)?2:0):(mask&10)|((mask&1)?4:0)|((mask&4)?1:0)}
function wirePaths(x,y,mask,color='#38666b',width=6){if(!mask)return '';let q='';for(const[d,bit,dx,dy]of DIRPORT){if(mask&bit)q+=`<path d="M${x+28} ${y+28}L${x+28+dx*28} ${y+28+dy*28}" stroke="${color}" stroke-width="${width}" fill="none" stroke-linecap="round"/>`;}q+=`<circle cx="${x+28}" cy="${y+28}" r="${width/2}" fill="${color}"/>`;return q}
function bridgeUI(){let l=current(),s=state,cell=56,pad=10,ports=activeTiles(l,s.mask),flapCells=new Set(l.flaps.map(f=>s.mask&(1<<l.flaps.indexOf(f))?f.dest:f.src));let svg=`<svg viewBox="0 0 300 300" role="img" aria-label="紙の線をつなぎ左から右へ進む"><defs><linearGradient id="bridgeTile" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f1f4e9"/><stop offset="1" stop-color="#d6e4dc"/></linearGradient></defs>`;
for(let i=0;i<25;i++){let x=pad+i%5*cell,y=pad+Math.floor(i/5)*cell;svg+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="url(#bridgeTile)" stroke="#315c5832" stroke-width="1"/>`}
for(let i=0;i<25;i++){let x=pad+(i%5)*cell,y=pad+Math.floor(i/5)*cell,c=s.flow?.visited.includes(i)?'#239b8c':'#52777a',w=s.flow?.visited.includes(i)?7:6;let hideOn=l.flaps.some((f,j)=>f.dest===i&&(s.mask&(1<<j)));if(!hideOn)svg+=wirePaths(x,y,l.base[i],c,w)}
for(let i=0;i<l.flaps.length;i++){let f=l.flaps[i],on=Boolean(s.mask&(1<<i)),pos=on?f.dest:f.src,x=pad+pos%5*cell,y=pad+Math.floor(pos/5)*cell;svg+=`<g class="bridge-flap ${on?'active':''}" data-flap="${i}" tabindex="0" role="button" aria-label="紙片 ${i+1} を${on?'開く':'折り返す'}"><rect class="bridge-flap-body" x="${x+4}" y="${y+4}" rx="6" width="48" height="48"/><path d="M${x+10} ${y+8}h11" stroke="#fff7e4" stroke-width="2.1" opacity=".8"/>${wirePaths(x,y,on?f.on:mirrorFlapPorts(f.on,f.hinge),on?'#2a8d7b':'#98764e',on?6:4)}<text class="bridge-paper-number" x="${x+45}" y="${y+14}">${i+1}</text>${!on?`<path d="M${x+28} ${y+39}l${f.hinge==='N'?'0 -8':f.hinge==='S'?'0 8':f.hinge==='E'?'8 0':'-8 0'}" stroke="#795936" stroke-width="2" stroke-linecap="round"/>`: ''}<rect x="${x+2}" y="${y+2}" width="52" height="52" fill="transparent"/></g>`}
svg+=`<circle cx="10" cy="150" r="7" fill="#f5c08c" stroke="#aa8052" stroke-width="2"/><circle cx="290" cy="150" r="7" fill="#6dbfae" stroke="#478e83" stroke-width="2"/><path d="M3 150H11 M290 150h7" stroke="#2d8175" stroke-width="3"/><text x="21" y="142" fill="#9a6750" font-size="9" font-weight="800">IN</text><text x="251" y="142" fill="#467b75" font-size="9" font-weight="800">OUT</text></svg>`;
return `<div class="bridge-legend"><span>◉ IN</span><strong>紙片を折って、線をつなぐ</strong><span>OUT ◉</span></div><div class="bridge-board" id="bridge-board">${svg}</div><div class="bridge-check-note">${s.attempt?s.flow.ok?'光が出口に届いた！':'光が途中で止まった。どこが切れている？':'紙片をタップして折る / もう一度タップして戻す'}</div><div class="bridge-extra">線の向きを見て、どの紙片を使うか考えよう。</div>`}
function bridgeToggle(index){if(busy)return;let s=state,l=current(),f=l.flaps[index];if(!f)return;const on=!!(s.mask&(1<<index)),g=app.querySelector(`[data-flap="${index}"]`);if(!g)return;busy=true;let a=on?f.dest:f.src,b=on?f.src:f.dest,dx=(b%5-a%5)*56,dy=(Math.floor(b/5)-Math.floor(a/5))*56;s.history.push(s.mask);s.flow=null;s.attempt=false;g.classList.add('fold-go');requestAnimationFrame(()=>{g.style.transform=`translate(${dx}px,${dy}px) scaleX(.82)`});sfx('fold');const token=epoch;setTimeout(()=>{if(token!==epoch||s!==state)return;s.mask^=(1<<index);busy=false;draw()},325)}
function bridgeCheck(){if(busy)return;let s=state,l=current();s.flow=bridgeFlow(l,s.mask);s.attempt=true;draw();if(s.flow.ok)celebrate(850);else{sfx('no');toast('つながっていない場所がある')}}
// ----------------------------------- ACTIONS / TOUCH -----------------------------------
function act(action,node){if(action==='sound'){saved.sound=!saved.sound;persist();if(game)draw();else home();if(saved.sound)sfx();return}if(action==='home'){home();return}if(action==='enter'){enter(node.dataset.kind);sfx();return}if(action==='level'){enter(game,+node.dataset.idx);sfx();return}if(action==='retry'){enter(game,level);return}if(action==='next'){enter(game,level+1);return}if(!game||won||busy)return;
if(action==='reset'){enter(game,level);sfx();return}if(action==='undo'){if(game==='flip'&&state.history.length){state.cols=state.history.pop();state.chosen=0;state.peek=true;sfx();draw()}if(game==='bridge'&&state.history.length){state.mask=state.history.pop();state.flow=null;state.attempt=false;sfx();draw()}return}
if(action==='peek'&&game==='flip'){state.peek=!state.peek;draw();return}if(action==='flip-fold'&&game==='flip'){flipDo(+node.dataset.k,node.dataset.dir);return}if(action==='crease-check'&&game==='crease'){creaseCheck();return}if(action==='clear'&&game==='crease'){state.axis=null;state.drawing=null;draw();sfx();return}if(action==='bridge-check'&&game==='bridge'){bridgeCheck();return}}
app.addEventListener('click',(e)=>{let n=e.target.closest('[data-action]');if(n){act(n.dataset.action,n);return}if(game==='bridge'){let f=e.target.closest('[data-flap]');if(f)bridgeToggle(+f.dataset.flap)}else if(game==='flip'){let col=e.target.closest('[data-flip]');if(col&&!foldDrag){state.chosen=+col.dataset.flip;state.peek=true;sfx();draw()}}});
document.addEventListener('click',e=>{if(e.target.closest('.win')){const a=e.target.closest('[data-action]');if(a)act(a.dataset.action,a)}});
app.addEventListener('pointerdown',e=>{if(!game||won||busy)return;if(game==='flip'){let el=e.target.closest('[data-flip]');if(!el)return;foldDrag={col:+el.dataset.flip,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};el.setPointerCapture?.(e.pointerId);return}if(game==='crease'){let bd=e.target.closest('#crease-surface');if(!bd)return;creaseDrag={start:creaseCoord(e,bd),last:creaseCoord(e,bd),board:bd,id:e.pointerId};bd.setPointerCapture?.(e.pointerId);e.preventDefault()}});
app.addEventListener('pointermove',e=>{if(game==='flip'&&foldDrag&&e.pointerId===foldDrag.id){if(Math.abs(e.clientX-foldDrag.x)>18)foldDrag.moved=true;foldDrag.dx=e.clientX-foldDrag.x;return}if(game==='crease'&&creaseDrag&&e.pointerId===creaseDrag.id){let d=creaseDrag;d.last=creaseCoord(e,d.board);let n=current().n;let p=creaseGeom(d.start,n),q=creaseGeom(d.last,n),line=d.board.querySelector('#raw-draw');if(line){line.style.display='block';line.setAttribute('x1',p[0]);line.setAttribute('y1',p[1]);line.setAttribute('x2',q[0]);line.setAttribute('y2',q[1]);}e.preventDefault()}});
function completePointer(e){if(foldDrag&&e.pointerId===foldDrag.id){const d=foldDrag;foldDrag=null;if(game!=='flip'||won)return;state.chosen=d.col;if(d.moved&&Math.abs(d.dx)>35){let k=d.dx>0?d.col+1:d.col,dir=d.dx>0?'L':'R';let possible=ffold(state.cols,k,dir);if(possible)flipDo(k,dir);else{sfx('no');toast('この方向には折れない');draw()}}else{state.peek=true;draw()}return}if(creaseDrag&&e.pointerId===creaseDrag.id){let d=creaseDrag;creaseDrag=null;if(game!=='crease'||won)return;let axis=creaseNearest(d.start,d.last,current().n);if(axis){state.axis=axis;sfx();draw()}else{app.querySelector('#raw-draw')?.setAttribute('style','display:none')}e.preventDefault()}}
app.addEventListener('pointerup',completePointer);app.addEventListener('pointercancel',completePointer);
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const col=e.target.closest('[data-flip]'),f=e.target.closest('[data-flap]');if(col&&game==='flip'){e.preventDefault();state.chosen=+col.dataset.flip;state.peek=true;draw()}if(f&&game==='bridge'){e.preventDefault();bridgeToggle(+f.dataset.flap)}}});
// Validate goal configuration at startup. Never publish an unwinnable trial.
function selfTest(){for(let [i,l] of LEVELS.flip.entries()){let cols=Array.from({length:l.n},(_,j)=>[[j,1]]),seen=new Set([JSON.stringify(cols)]),q=[cols],reached=false;for(let h=0;h<q.length;h++){let a=q[h];if(flipSolved(l,a)){reached=true;break}if(q.length>3200)break;for(let k=1;k<a.length;k++)for(let dir of ['L','R']){let b=ffold(a,k,dir);if(b){let s=JSON.stringify(b);if(!seen.has(s)){seen.add(s);q.push(b)}}}}if(!reached)throw Error(`FLIP ${i+1} unreachable`)}for(let [i,l] of LEVELS.crease.entries()){let all=0;for(let a of creaseAxes(l.n))if(creaseSolved(l,a))all++;if(all!==1)throw Error(`CREASE ${i+1} nonunique (${all})`)}for(let [i,l]of LEVELS.bridge.entries()){let goals=[];for(let m=0;m<1<<l.flaps.length;m++)if(bridgeFlow(l,m).ok)goals.push(m);if(goals.length!==1||goals[0]!==l.solution)throw Error(`BRIDGE ${i+1} nonunique`)}return true}
try{selfTest()}catch(err){console.error(err);let badge=document.createElement('p');badge.textContent='Problem validation error: '+err.message;badge.style.color='#d99';document.body.prepend(badge)}
home();
</script></body></html>
