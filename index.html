.drift-zone{position:absolute;inset:0;padding:10.5%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}.drift-zone:active{cursor:grabbing}.drift-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4px;position:relative}.drift-cell{border-radius:9px;background:#263a41b3;box-shadow:inset 0 1px #ffffff07}.drift-cell.wall{background:repeating-linear-gradient(135deg,#49606a,#49606a 4px,#3f555f 4px,#3f555f 8px);border:1px solid #5b747a;box-shadow:inset 0 1px #ffffff15}.drift-layer{position:absolute;inset:0;pointer-events:none}.drift-goal,.drift-bead{position:absolute;left:calc((var(--x) + .5)*20%);top:calc((var(--y) + .5)*20%);translate:-50% -50%;border-radius:50%}.drift-goal{width:17.2%;aspect-ratio:1;border:3.2px solid var(--tone);background:color-mix(in srgb,var(--tone),transparent 91%);box-shadow:0 0 0 3px #ffffff05,inset 0 0 0 6px #182931;opacity:.88}.drift-bead{width:12.5%;aspect-ratio:1;background:radial-gradient(circle at 34% 28%,#ffffff84,transparent 27%),var(--tone);border:2px solid #ffffff35;box-shadow:0 6px 14px #06111780,inset 0 -5px 8px #15232c18;transition:left .21s var(--ease),top .21s var(--ease),box-shadow .18s;z-index:4}.drift-bead:after{content:'';position:absolute;inset:34%;border-radius:50%;background:#1c353d61}.drift-bead.hit{animation:softHit .24s}.drift-bead.at-goal{box-shadow:0 0 0 5px #ffffff12,0 3px 15px #0006}.drift-note{font-size:10px;color:#9fb7b9;letter-spacing:.02em}.drift-mark{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;color:#75949b;letter-spacing:.1em;pointer-events:none}.hint-path{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;color:#d6e9e0;opacity:.3;font-size:26px;animation:hintPulse 2.4s infinite}

const WORD={ja:{header:'たった一手が、すべてを変える。',homeSub:'動く前に考える。結果を予測する。手触りから新しい面白さを探す、2つの実験。',driftSub:'ひとつのスワイプで、2つの玉が動く。',braidSub:'交点を切り替え、色の出口をそろえる。',driftObjective:'2色の玉を、それぞれの輪へ',braidObjective:'出口の色を、輪の色に合わせる',swipe:'盤面をスワイプ',toggle:'交点をタップして入れ替える',moves:'手',on:'切替',match:'一致',undo:'戻す',reset:'最初から',next:'次の問題',try:'もう一度',cleared:'すべてそろった。',noMore:'これ以上の交点は選べない',stage:'問題',develop:'ゲーム性を検証する研究版。面白さは未判定。',gesture:'指でスワイプして動かす',best:'最短',gameList:'試してみる'},en:{header:'One move changes everything.',homeSub:'Think before moving. Predict the result. Two experiments in the joy of one precise action.',driftSub:'One swipe moves both marbles.',braidSub:'Switch junctions to match the outputs.',driftObjective:'Guide both marbles to their matching rings',braidObjective:'Match each output to its colored ring',swipe:'SWIPE ANYWHERE',toggle:'TAP JUNCTIONS TO SWAP',moves:'moves',on:'active',match:'match',undo:'Undo',reset:'Reset',next:'Next level',try:'Try again',cleared:'Perfect connection.',noMore:'No more switches available',stage:'LEVEL',develop:'Research prototypes. Fun factor not yet validated.',gesture:'Swipe to move both marbles',best:'Shortest',gameList:'Explore'}};
let app=document.getElementById('app'),locale='ja',game=null,stage=0,state=null,winning=false,audio=null,progress=null,pointer=null,flash='';
try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d&&typeof d==='object')progress=d}catch(e){};
if(!progress)progress={sound:true,lang:'ja',drift:{unlocked:1,done:[]},braid:{unlocked:1,done:[]}};
for(const k of ['drift','braid']){if(!progress[k]||typeof progress[k]!=='object')progress[k]={unlocked:1,done:[]};if(!Array.isArray(progress[k].done))progress[k].done=[];progress[k].unlocked=Math.max(1,Math.min(8,Number(progress[k].unlocked)||1))};

const t=(k)=>WORD[locale][k]??k;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(progress))}catch(e){}}
function note(m){flash=m;renderStatus();}
function sound(f=450,d=.065,kind='sine',vol=.017,delay=0){if(!progress.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),time=audio.currentTime+delay;o.type=kind;o.frequency.setValueAtTime(f,time);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+.008);g.gain.exponentialRampToValueAtTime(.0001,time+d);o.connect(g);g.connect(audio.destination);o.start(time);o.stop(time+d+.01)}catch(e){}}
function sfx(kind){if(kind==='tap'){sound(470,.065);sound(710,.04,'sine',.006,.025)}else if(kind==='move'){sound(250,.095,'sine',.019);sound(410,.058,'sine',.007,.03)}else if(kind==='blocked'){sound(210,.045,'sine',.008)}else if(kind==='win'){[480,600,720,960].forEach((f,i)=>sound(f,.22,'sine',.012,i*.07))}}
const volumeIcon=()=>progress.sound?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>`;
function topBar(){return `<header class="top"><div class="ident">${game?`<button class="tool" data-act="home" aria-label="Back">‹</button>`:`<div class="mark">◇</div>`}<div class="brand">CORE LAB<small>ONE MOVE · VOL.04</small></div></div><div class="tools"><button class="tool lang" data-act="lang" aria-label="Language">${locale==='ja'?'EN':'JP'}</button><button class="tool" data-act="sound" aria-label="Sound">${volumeIcon()}</button></div></header>`}

function renderHome(){game=null;app.className='app';app.innerHTML=topBar()+`<div class="home-view"><section class="hero"><div class="over">NEW MECHANICS · VOL.04</div><h1>${t('header')}</h1><p>${t('homeSub')}</p></section><section class="catalog">${['drift','braid'].map((k,i)=>`<button class="entry" data-act="enter" data-game="${k}"><div class="entry-art">${miniArt(k)}</div><div class="entry-info"><span class="entry-id">EXPERIMENT 0${i+1} · 08 STAGES</span><span class="entry-name">${META[k].name}</span><span class="entry-sub">${t(k+'Sub')}</span><span class="entry-level">${progress[k].done.length} / 8 CLEARED</span></div><span class="entry-next">›</span></button>`).join('')}</section><p class="footnote">${t('develop')}</p></div>`}

function renderGame(){app.className='app';app.innerHTML=topBar()+stageHead()+`<div class="board-wrap"><div class="board-frame" id="board">${board()}</div></div><section class="bottom"><div class="status-line" id="stats"></div><div class="bar"><button class="ctrl secondary" data-act="undo" aria-label="${t('undo')}" ${state.history.length?'':'disabled'}>↶</button><button class="ctrl tertiary" data-act="reset" aria-label="Reset">↺</button><button class="ctrl main" data-act="main" style="${winning?'':'display:none'}">${t('next')} <span style="font-size:17px">›</span></button></div><div class="feedback ${winning?'won':''}" id="hint"></div></section>`;renderStatus();}
function start(k,idx=0){game=k;stage=Math.max(0,Math.min(idx,progress[k].unlocked-1,7));state=k==='drift'?{pos:LEVELS.drift[stage].start.slice(),history:[],moves:0}:{mask:0,history:[],moves:0};winning=false;flash='';pointer=null;renderGame()}
function renderStatus(){if(!game)return;let l=LEVELS[game],lv=l[stage],s=document.getElementById('stats'),h=document.getElementById('hint');if(!s||!h)return;if(game==='drift'){s.innerHTML=`<span>${t('moves')} <strong>${state.moves}</strong>　 ·　 ${t('best')} ${lv.depth}</span><span>${winning?'✓ 2 / 2':`<span style="color:var(--aqua)">●</span> <span style="color:var(--peach)">●</span>`}</span>`;h.textContent=winning?t('cleared'):(flash||t('swipe'))}else{let count=bitcount(state.mask),matches=braidPermutation(lv,state.mask).filter((x,i)=>x===lv.goal[i]).length;s.innerHTML=`<span>${t('on')} <strong>${count} / ${lv.k}</strong></span><span>${t('match')} <strong class="${winning?'good':''}">${matches} / ${lv.n}</strong></span>`;h.textContent=winning?t('cleared'):(flash||t('toggle'))}}
function posStyle(pos){return `--x:${pos%5};--y:${Math.floor(pos/5)}`}
function driftBoard(){let l=LEVELS.drift[stage],p=state.pos,blocks=new Set(l.blocks);return `<div class="drift-zone" id="drift-zone" aria-label="${t('gesture')}" role="application"><div class="drift-grid">${Array.from({length:25},(_,i)=>`<span class="drift-cell ${blocks.has(i)?'wall':''}"></span>`).join('')}<div class="drift-layer">${l.goal.map((q,i)=>`<div class="drift-goal" style="${posStyle(q)};--tone:${COL[i]}"></div>`).join('')}${p.map((q,i)=>`<div class="drift-bead ${p[i]===l.goal[i]?'at-goal':''}" data-marble="${i}" style="${posStyle(q)};--tone:${COL[i]}"></div>`).join('')}</div></div></div>${winning?'<div class="win-splash"></div>':''}`}
function applyDrift(state,dir,blocks){const step=p=>{let x=p%5,y=Math.floor(p/5),nx=x+dir[0],ny=y+dir[1];if(nx<0||ny<0||nx>4||ny>4)return p;let q=ny*5+nx;return blocks.includes(q)?p:q};let [a,b]=state,na=step(a),nb=step(b);if(na===nb||(na===b&&nb===a))return [a,b];if(na===b&&nb===b)na=a;if(nb===a&&na===a)nb=b;return [na,nb]}
function driftMove(index){if(winning||game!=='drift')return;let l=LEVELS.drift[stage],next=applyDrift(state.pos,DIRS[index],l.blocks),old=state.pos;if(next[0]===old[0]&&next[1]===old[1]){sfx('blocked');let els=document.querySelectorAll('.drift-bead');els.forEach(el=>{el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')});return}state.history.push(old.slice());state.pos=next;state.moves++;flash='';sfx('move');document.querySelectorAll('.drift-bead').forEach((el,i)=>{el.style.setProperty('--x',next[i]%5);el.style.setProperty('--y',Math.floor(next[i]/5));el.classList.toggle('at-goal',next[i]===l.goal[i])});let goal=next.every((v,i)=>v===l.goal[i]);if(goal)markWin();else renderStatus();let btn=document.querySelector('[data-act="undo"]');if(btn)btn.disabled=false}
function bitcount(m){let n=0;while(m){m&=m-1;n++}return n}
function braidPermutation(l,mask){let order=Array.from({length:l.n},(_,i)=>i);l.pairs.forEach((lane,i)=>{if(mask&(1<<i)){let v=order[lane];order[lane]=order[lane+1];order[lane+1]=v}});return order}
function braidSvgPaths(l,mask){let n=l.n,rows=Array.from({length:n},(_,i)=>180+(i-(n-1)/2)*(n===3?78:n===4?65:55)),xs=l.pairs.map((_,i)=>52+i*(255/Math.max(1,l.pairs.length-1))),left=19,right=335;let routes=Array.from({length:n},()=>`M${left} 0`),order=Array.from({length:n},(_,i)=>i),px=left;routes=Array.from({length:n},(_,id)=>`M${left} ${rows[id]}`);
 l.pairs.forEach((lane,i)=>{let x=xs[i],xa=x-15,xb=x+15,active=!!(mask&(1<<i));for(let r=0;r<n;r++){let color=order[r],current=rows[r],out=(active&&(r===lane||r===lane+1))?rows[r===lane?lane+1:lane]:current;routes[color]+= ` L${xa.toFixed(2)} ${current.toFixed(2)} C${(x-5).toFixed(2)} ${current.toFixed(2)} ${(x+5).toFixed(2)} ${out.toFixed(2)} ${xb.toFixed(2)} ${out.toFixed(2)}`;}
 if(active){let tmp=order[lane];order[lane]=order[lane+1];order[lane+1]=tmp} px=xb;
 });for(let id=0;id<n;id++)routes[id]+= ` L${right} ${rows[order.indexOf(id)]}`;return {rows,xs,paths:routes,order};}
function braidBoard(){let l=LEVELS.braid[stage],d=braidSvgPaths(l,state.mask),rows=d.rows,xs=d.xs;let paths=d.paths.map((p,id)=>`<path class="ribbon" d="${p}" stroke="${COL[id]}"></path>`).join('');let switches=l.pairs.map((lane,i)=>{let x=xs[i],y=(rows[lane]+rows[lane+1])/2,on=!!(state.mask&(1<<i));return `<g class="switch ${on?'on':''}" data-switch="${i}" role="button" tabindex="0" aria-label="${i+1}番目の交点を切り替える" transform="translate(${x} ${y})"><circle class="ring" r="20.5"/><rect class="housing" x="-16.8" y="-17" width="33.6" height="34" rx="11"/><path class="symbol" d="${on?'M-5.6 -6 L5.6 6 M5.6 -6 L-5.6 6':'M-5.3 -6 V6 M5.3 -6 V6'}"/><rect class="hit" x="-22" y="-24" width="44" height="48" rx="18"/></g>`}).join('');let goals=rows.map((y,row)=>{let actual=d.order[row],goal=l.goal[row];return `<circle class="target-ring" cx="335" cy="${y}" r="16.5" stroke="${COL[goal]}"/><circle class="result-dot" cx="335" cy="${y}" r="10.1" fill="${COL[actual]}"/>`}).join('');let starts=rows.map((y,i)=>`<circle class="strand-dot" cx="19" cy="${y}" r="10.5" fill="${COL[i]}"/>`).join('');return `<svg class="braid-svg" viewBox="0 0 360 360" aria-label="色の線を交差させて目標の出口へ"><text class="braid-label" x="19" y="39">IN</text><text class="braid-label" x="315" y="39">OUT</text>${rows.map(y=>`<line class="rail-guide" x1="19" x2="335" y1="${y}" y2="${y}"/>`).join('')}<g class="ribbons" id="ribbons">${paths}</g>${starts}${goals}${switches}</svg>${winning?'<div class="win-splash"></div>':''}`}
function animateBraid(fromMask,toMask){const lv=LEVELS.braid[stage],els=[...document.querySelectorAll('#ribbons .ribbon')];const from=braidSvgPaths(lv,fromMask).paths.map(s=>[...s.matchAll(/-?\d+(?:\.\d+)?/g)].map(m=>Number(m[0])));const toPaths=braidSvgPaths(lv,toMask).paths;const to=toPaths.map(s=>[...s.matchAll(/-?\d+(?:\.\d+)?/g)].map(m=>Number(m[0])));const mark=state,begin=performance.now(),dur=235;function frame(now){if(state!==mark||game!=='braid')return;let q=Math.min(1,(now-begin)/dur),ease=1-Math.pow(1-q,3);els.forEach((el,i)=>{let j=0;el.setAttribute('d',toPaths[i].replace(/-?\d+(?:\.\d+)?/g,()=>{let v=from[i][j]+(to[i][j]-from[i][j])*ease;j++;return v.toFixed(2)}))});if(q<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function braidToggle(i){if(game!=='braid'||winning)return;let l=LEVELS.braid[stage],next=state.mask^(1<<i);if(bitcount(next)>l.k){flash=t('noMore');sfx('blocked');renderStatus();return}state.history.push(state.mask);state.mask=next;state.moves++;flash='';sfx('tap');const b=document.getElementById('board');if(!b)return;const oldMask=state.history[state.history.length-1];
 // The strands now morph smoothly to the new route, rather than jumping between two states.
 b.innerHTML=braidBoard();animateBraid(oldMask,next);
 let perm=braidPermutation(l,next);if(perm.every((id,j)=>id===l.goal[j]))markWin();else renderStatus();let undo=document.querySelector('[data-act="undo"]');if(undo)undo.disabled=false}
function markWin(){if(winning)return;winning=true;let done=progress[game].done;if(!done.includes(stage))done.push(stage);progress[game].unlocked=Math.min(8,Math.max(progress[game].unlocked,stage+2));save();sfx('win');let b=document.getElementById('board');if(b&&!b.querySelector('.win-splash'))b.insertAdjacentHTML('beforeend','<div class="win-splash"></div>');let btn=document.querySelector('.ctrl.main');if(btn){btn.style.display='';btn.textContent=stage===7?(locale==='ja'?'最後の問題をクリア':'All cleared'):t('next')+' ›'}renderStatus()}
function undo(){if(!state.history.length||winning)return;let p=state.history.pop();flash='';if(game==='drift'){state.pos=p;state.moves=Math.max(0,state.moves-1);document.querySelectorAll('.drift-bead').forEach((el,i)=>{el.style.setProperty('--x',p[i]%5);el.style.setProperty('--y',Math.floor(p[i]/5));el.classList.toggle('at-goal',p[i]===LEVELS.drift[stage].goal[i])})}else{state.mask=p;state.moves=Math.max(0,state.moves-1);document.getElementById('board').innerHTML=braidBoard()}sfx('tap');renderStatus();let el=document.querySelector('[data-act="undo"]');if(el)el.disabled=!state.history.length}
function mainAction(){if(winning){if(stage<7)start(game,stage+1);else renderHome();return}if(game==='drift'){note(t('gesture'));return}note(t('toggle'))}
app.addEventListener('click',e=>{let node=e.target.closest('[data-act]');if(node){let a=node.dataset.act;if(a==='sound'){progress.sound=!progress.sound;save();game?renderGame():renderHome()}if(a==='lang'){locale=locale==='ja'?'en':'ja';progress.lang=locale;save();game?renderGame():renderHome()}if(a==='home'){renderHome()}if(a==='enter'){start(node.dataset.game,Math.min(progress[node.dataset.game].unlocked-1,7))}if(a==='undo')undo();if(a==='reset')start(game,stage);if(a==='main')mainAction();return}let sw=e.target.closest('[data-switch]');if(sw&&game==='braid')braidToggle(Number(sw.dataset.switch));});
document.addEventListener('keydown',e=>{if(game==='drift'&&['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();driftMove(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key))}else if(game==='braid'&&(e.key==='Enter'||e.key===' ')){let sw=e.target.closest('[data-switch]');if(sw){e.preventDefault();braidToggle(Number(sw.dataset.switch))}}});
app.addEventListener('pointerdown',e=>{if(game!=='drift'||winning||!e.target.closest('#drift-zone'))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};e.preventDefault();e.target.setPointerCapture?.(e.pointerId)},{passive:false});
app.addEventListener('pointerup',e=>{if(!pointer||game!=='drift'||e.pointerId!==pointer.id)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.hypot(dx,dy)<23)return;driftMove(Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0)});
app.addEventListener('pointercancel',()=>{pointer=null});
function selfCheck(){// Check each stored shortest path, goal, and uniqueness at specified minimal toggle budget.
 for(const l of LEVELS.drift){let p=l.start.slice();for(const dir of l.shortest)p=applyDrift(p,DIRS[dir],l.blocks);if(p.join()!==l.goal.join()||l.shortest.length!==l.depth)throw Error('DRIFT invalid stage')}
 for(const l of LEVELS.braid){let perm=braidPermutation(l,l.solution);if(perm.join()!==l.goal.join()||bitcount(l.solution)!==l.k)throw Error('BRAID invalid solution');let best=99,count=0;for(let mask=0;mask<(1<<l.pairs.length);mask++)if(braidPermutation(l,mask).join()===l.goal.join()){let c=bitcount(mask);if(c<best){best=c;count=1}else if(c===best)count++}if(best!==l.k||count!==1)throw Error('BRAID non-unique shortest solution')}}
try{selfCheck()}catch(err){console.error(err)}renderHome();
</script></body></html>
