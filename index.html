function topBar(){return `<header class="top"><div class="ident">${game?`<button class="tool" data-act="home" aria-label="Back">‹</button>`:`<div class="mark">◇</div>`}<div class="brand">CORE LAB<small>TWO MARBLES · VOL.05</small></div></div><div class="tools"><button class="tool lang" data-act="lang" aria-label="Language">${locale==='ja'?'EN':'JP'}</button><button class="tool" data-act="sound" aria-label="Sound">${volumeIcon()}</button></div></header>`}
function miniArt(k){if(k==='gate')return `<svg viewBox="0 0 150 135"><rect x="16" y="8" width="118" height="118" rx="19" fill="#243942" stroke="#80d9c6" stroke-opacity=".35"/><g fill="#3c535b">${Array.from({length:25},(_,i)=>`<rect x="${22+i%5*22}" y="${14+Math.floor(i/5)*22}" width="18" height="18" rx="4"/>`).join('')}</g><rect x="66" y="58" width="18" height="18" rx="4" fill="#457c70" stroke="#9be5c8" stroke-width="1.7"/><path d="M74 67L96 89" fill="none" stroke="#9be5c8" stroke-width="1.6" stroke-dasharray="3 4"/><rect x="88" y="80" width="18" height="18" rx="3" fill="#1c3341" stroke="#9be5c8" stroke-width="2.2"/><circle cx="52" cy="67" r="9" fill="#80d9c6"/><circle cx="117" cy="89" r="9" fill="#e8b78b"/></svg>`;if(k==='drift')return `<svg viewBox="0 0 150 135"><rect x="18" y="10" width="116" height="116" rx="18" fill="#243943" stroke="#67847c" stroke-opacity=".5"/><g fill="#39535c">${Array.from({length:25},(_,i)=>`<rect x="${24+(i%5)*22}" y="${16+Math.floor(i/5)*22}" width="18" height="18" rx="4"/>`).join('')}</g><path d="M74 38V60H96V82" fill="none" stroke="#c1eadf" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 6"/><rect x="46" y="60" width="18" height="18" rx="4" fill="#71888e"/><circle cx="74" cy="38" r="11" fill="#80d9c6"/><circle cx="96" cy="82" r="11" fill="#e8b78b"/><circle cx="96" cy="38" r="14" fill="none" stroke="#e8b78b" stroke-width="2.5" opacity=".7"/></svg>`;return `<svg viewBox="0 0 150 135"><g fill="none" stroke-width="6" stroke-linecap="round"><path d="M14 27C48 27 53 49 77 49S113 27 135 27" stroke="#e8b78b"/><path d="M14 49C47 49 52 27 77 27S113 49 135 49" stroke="#80d9c6"/><path d="M14 76H135" stroke="#bdacd9"/><path d="M14 100C56 100 67 122 87 122S119 100 135 100" stroke="#e2d2a1"/><path d="M14 122C56 122 67 100 87 100S119 122 135 122" stroke="#91b9da"/></g><circle cx="73" cy="38" r="15" fill="#243943" stroke="#cdb4de" stroke-width="1.5"/><path d="m67 32 12 12m0-12-12 12" stroke="#e2c8ef" stroke-width="2.3" stroke-linecap="round"/></svg>`}
function renderHome(){game=null;app.className='app';app.innerHTML=topBar()+`<div class="home-view"><section class="hero"><div class="over">TWO MARBLES · VOL.05</div><h1>${t('header')}</h1><p>${t('homeSub')}</p></section><section class="catalog">${['gate','drift','braid'].map((k,i)=>`<button class="entry" data-act="enter" data-game="${k}"><div class="entry-art">${miniArt(k)}</div><div class="entry-info"><span class="entry-id">EXPERIMENT 0${i+1} · ${String(LEVELS[k].length).padStart(2,'0')} STAGES</span><span class="entry-name">${META[k].name}</span><span class="entry-sub">${t(k+'Sub')}</span><span class="entry-level">${progress[k].done.length} / ${LEVELS[k].length} CLEARED</span></div><span class="entry-next">›</span></button>`).join('')}</section><p class="footnote">${t('develop')}</p></div>`}
function stageHead(){return `<section class="game-head"><div class="game-over">${game==='gate'?'01 / CONDITIONAL CONTROL':game==='drift'?'02 / SHARED MOTION':'03 / PERMUTATION'}</div><div class="heading-row"><h1>${META[game].name}</h1><span class="level-tag">${String(stage+1).padStart(2,'0')} / ${String(LEVELS[game].length).padStart(2,'0')}</span></div><div class="game-sub">${t(game+'Objective')}</div><div class="progress">${Array.from({length:LEVELS[game].length},(_,i)=>`<span class="${progress[game].done.includes(i)?'past':i===stage?'now':''}"></span>`).join('')}</div></section>`}
function board(){return game==='braid'?braidBoard():driftBoard()}
function renderGame(){app.className='app';app.innerHTML=topBar()+stageHead()+`<div class="board-wrap"><div class="board-frame" id="board">${board()}</div></div><section class="bottom"><div class="status-line" id="stats"></div><div class="bar ${winning?'complete':'playing'}"><button class="ctrl secondary" data-act="undo" aria-label="${t('undo')}" ${state.history.length?'':'disabled'}>↶ <span>${t('undo')}</span></button><button class="ctrl tertiary" data-act="reset" aria-label="${t('reset')}">↺ <span>${winning?'':t('reset')}</span></button><button class="ctrl main" data-act="main" style="${winning?'':'display:none'}">${t('next')} <span style="font-size:17px">›</span></button></div><div class="feedback ${winning?'won':''}" id="hint"></div></section>`;renderStatus();}
function start(k,idx=0){game=k;stage=Math.max(0,Math.min(idx,progress[k].unlocked-1,7));state=k==='braid'?{mask:0,history:[],moves:0,focus:null}:{pos:LEVELS[k][stage].start.slice(),history:[],moves:0};winning=false;flash='';pointer=null;renderGame()}
function renderStatus(){if(!game)return;let l=LEVELS[game],lv=l[stage],s=document.getElementById('stats'),h=document.getElementById('hint');if(!s||!h)return;if(game==='drift'||game==='gate'){s.innerHTML=`<span>${t('moves')} <strong>${state.moves}</strong>　 ·　 ${t('best')} ${lv.depth}</span><span>${game==='gate'?`<span class="gate-status ${gateVisualOpen(state.pos,lv)?'live':''}">${gateLit(state.pos,lv)?t('gateStatusOn'):gateVisualOpen(state.pos,lv)?t('gateStatusHeld'):t('gateStatusOff')}</span>`:winning?'✓ 2 / 2':`<span style="color:var(--aqua)">●</span> <span style="color:var(--peach)">●</span>`}</span>`;h.textContent=winning?t('cleared'):(flash||t('swipe'))}else{let count=bitcount(state.mask),matches=braidPermutation(lv,state.mask).filter((x,i)=>x===lv.goal[i]).length;s.innerHTML=`<span>${t('on')} <strong>${count} / ${lv.k}</strong></span><span>${t('match')} <strong class="${winning?'good':''}">${matches} / ${lv.n}</strong></span>`;h.textContent=winning?t('cleared'):(flash||t('toggle'))}}
function posStyle(pos){return `--x:${pos%5};--y:${Math.floor(pos/5)}`}
function gateLit(pos,level){return level.plate===pos[0]||level.plate===pos[1]}
function gateVisualOpen(pos,level){return gateLit(pos,level)||pos.includes(level.door)}
function driftBoard(){let l=LEVELS[game][stage],p=state.pos,blocks=new Set(l.blocks),special=game==='gate',open=special&&gateVisualOpen(p,l);let wire=special?`<svg class="gate-wire ${gateLit(p,l)?'on':''}" viewBox="0 0 100 100"><path d="M${(l.plate%5+.5)*20} ${(Math.floor(l.plate/5)+.5)*20}L${(l.door%5+.5)*20} ${(Math.floor(l.door/5)+.5)*20}"/></svg>`:'';return `<div class="drift-zone" id="drift-zone" aria-label="${t('gesture')}" role="application"><div class="drift-grid">${Array.from({length:25},(_,i)=>`<span class="drift-cell ${blocks.has(i)?'wall':''} ${special&&i===l.plate?'plate '+(gateLit(p,l)?'pressed':''):''} ${special&&i===l.door?'gate '+(open?'open':'shut'):''}" ${special&&i===l.plate?'aria-label="Switch plate"':special&&i===l.door?'aria-label="Gate"':''}></span>`).join('')}${wire}<div class="drift-layer">${l.goal.map((q,i)=>`<div class="drift-goal" style="${posStyle(q)};--tone:${COL[i]}"></div>`).join('')}${p.map((q,i)=>`<div class="drift-bead ${p[i]===l.goal[i]?'at-goal':''}" data-marble="${i}" style="${posStyle(q)};--tone:${COL[i]}"></div>`).join('')}</div></div></div>${winning?'<div class="win-splash"></div>':''}`}
function applyDrift(state,dir,blocks,plate=null,door=null){const step=p=>{let x=p%5,y=Math.floor(p/5),nx=x+dir[0],ny=y+dir[1];if(nx<0||ny<0||nx>4||ny>4)return p;let q=ny*5+nx;return (blocks.includes(q)||(q===door&&!state.includes(plate)))?p:q};let [a,b]=state,na=step(a),nb=step(b);if(na===nb||(na===b&&nb===a))return [a,b];if(na===b&&nb===b)na=a;if(nb===a&&na===a)nb=b;return [na,nb]}
function driftMove(index){if(winning||(game!=='drift'&&game!=='gate'))return;let l=LEVELS[game][stage],next=applyDrift(state.pos,DIRS[index],l.blocks,game==='gate'?l.plate:null,game==='gate'?l.door:null),old=state.pos;if(next[0]===old[0]&&next[1]===old[1]){sfx('blocked');let els=document.querySelectorAll('.drift-bead');els.forEach(el=>{el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')});return}state.history.push(old.slice());state.pos=next;state.moves++;flash='';sfx('move');document.querySelectorAll('.drift-bead').forEach((el,i)=>{el.style.setProperty('--x',next[i]%5);el.style.setProperty('--y',Math.floor(next[i]/5));el.classList.toggle('at-goal',next[i]===l.goal[i])});if(game==='gate'){const live=gateLit(next,l),open=gateVisualOpen(next,l),plateEl=document.querySelector('.drift-cell.plate'),doorEl=document.querySelector('.drift-cell.gate'),wire=document.querySelector('.gate-wire');plateEl?.classList.toggle('pressed',live);doorEl?.classList.toggle('open',open);doorEl?.classList.toggle('shut',!open);wire?.classList.toggle('on',live)}let goal=next.every((v,i)=>v===l.goal[i]);if(goal)markWin();else renderStatus();let btn=document.querySelector('[data-act="undo"]');if(btn)btn.disabled=false}
function bitcount(m){let n=0;while(m){m&=m-1;n++}return n}
function braidPermutation(l,mask){let order=Array.from({length:l.n},(_,i)=>i);l.pairs.forEach((lane,i)=>{if(mask&(1<<i)){let v=order[lane];order[lane]=order[lane+1];order[lane+1]=v}});return order}
function braidSvgPaths(l,mask){
 const n=l.n,rows=Array.from({length:n},(_,i)=>180+(i-(n-1)/2)*(n===3?78:n===4?65:55));
 const xs=l.pairs.map((_,i)=>59+i*(199/Math.max(1,l.pairs.length-1))),left=28,right=288;
 let order=Array.from({length:n},(_,i)=>i);
 let routes=Array.from({length:n},(_,id)=>`M${left} ${rows[id]}`);
 l.pairs.forEach((lane,i)=>{
  const x=xs[i],xa=x-13,xb=x+13,active=!!(mask&(1<<i));
  for(let r=0;r<n;r++){
   const color=order[r],current=rows[r],out=(active&&(r===lane||r===lane+1))?rows[r===lane?lane+1:lane]:current;
   routes[color]+=` L${xa.toFixed(2)} ${current.toFixed(2)} C${(x-4).toFixed(2)} ${current.toFixed(2)} ${(x+4).toFixed(2)} ${out.toFixed(2)} ${xb.toFixed(2)} ${out.toFixed(2)}`;
  }
  if(active){const tmp=order[lane];order[lane]=order[lane+1];order[lane+1]=tmp}
 });
 for(let id=0;id<n;id++)routes[id]+=` L${right} ${rows[order.indexOf(id)]}`;
 return {rows,xs,paths:routes,order};
}
function braidBoard(){
 const l=LEVELS.braid[stage],d=braidSvgPaths(l,state.mask),rows=d.rows,xs=d.xs;
 const focus=state.focus??null,selecting=focus!==null;
 const paths=d.paths.map((p,id)=>`<path class="ribbon ${focus===id?'selected':''}" d="${p}" stroke="${COL[id]}"/>`).join('');
 const switches=l.pairs.map((lane,i)=>{
  const x=xs[i],y=(rows[lane]+rows[lane+1])/2,on=!!(state.mask&(1<<i));
  return `<g class="switch ${on?'on':''}" data-switch="${i}" role="button" tabindex="0" aria-label="${i+1}番目の交点を切り替える" transform="translate(${x} ${y})"><circle class="ring" r="20"/><rect class="housing" x="-14.5" y="-14.5" width="29" height="29" rx="9"/><path class="symbol" d="${on?'M-5.4 -5.4 L5.4 5.4 M5.4 -5.4 L-5.4 5.4':'M-4.8 -5.4 V5.4 M4.8 -5.4 V5.4'}"/><rect class="hit" x="-21" y="-23" width="42" height="46" rx="18"/></g>`;
 }).join('');
 const badge=(x,y,id,kind)=>`<g class="port ${kind} ${focus===id?'selected':''}" data-trace="${id}" role="button" tabindex="0" aria-label="${id+1}番の線を追う"><circle class="focus-ring" cx="${x}" cy="${y}" r="20.4"/><circle class="puck" cx="${x}" cy="${y}" r="14.8" fill="${COL[id]}"/><text class="puck-label" x="${x}" y="${y+.3}">${id+1}</text><circle class="hit-port" cx="${x}" cy="${y}" r="22"/></g>`;
 const starts=rows.map((y,id)=>badge(28,y,id,'source')).join('');
 const goals=rows.map((y,row)=>{
  const actual=d.order[row],wanted=l.goal[row],correct=actual===wanted;
  return `<g class="arrival ${focus===actual?'selected':''} ${correct?'ok':''}" data-trace="${actual}" role="button" tabindex="0" aria-label="${actual+1}番の到着位置"><circle class="arrive-halo" cx="288" cy="${y}" r="17.5"/><circle class="arrive-dot" cx="288" cy="${y}" r="11.2" fill="${COL[actual]}"/><text class="arrive-label" x="288" y="${y}">${actual+1}</text><circle class="hit-port" cx="288" cy="${y}" r="16"/></g>${badge(335,y,wanted,'target')}`;
 }).join('');
 return `<svg class="braid-svg ${selecting?'tracing':''}" viewBox="0 0 360 360" role="img" aria-label="左の番号を右の同じ番号へつなぐ。丸を触ると線を追える。"><text class="braid-label" x="28" y="39">${locale==='ja'?'出発':'FROM'}</text><text class="braid-label" x="288" y="39">${locale==='ja'?'いま':'NOW'}</text><text class="braid-label" x="335" y="39">${locale==='ja'?'目標':'GOAL'}</text>${rows.map(y=>`<line class="rail-guide" x1="28" x2="335" y1="${y}" y2="${y}"/>`).join('')}<g class="ribbons" id="ribbons">${paths}</g>${starts}${goals}${switches}</svg>${winning?'<div class="win-splash"></div>':''}`;
}
function animateBraid(fromMask,toMask){const lv=LEVELS.braid[stage],els=[...document.querySelectorAll('#ribbons .ribbon')];const from=braidSvgPaths(lv,fromMask).paths.map(s=>[...s.matchAll(/-?\d+(?:\.\d+)?/g)].map(m=>Number(m[0])));const toPaths=braidSvgPaths(lv,toMask).paths;const to=toPaths.map(s=>[...s.matchAll(/-?\d+(?:\.\d+)?/g)].map(m=>Number(m[0])));const mark=state,begin=performance.now(),dur=235;function frame(now){if(state!==mark||game!=='braid')return;let q=Math.min(1,(now-begin)/dur),ease=1-Math.pow(1-q,3);els.forEach((el,i)=>{let j=0;el.setAttribute('d',toPaths[i].replace(/-?\d+(?:\.\d+)?/g,()=>{let v=from[i][j]+(to[i][j]-from[i][j])*ease;j++;return v.toFixed(2)}))});if(q<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function braidToggle(i){if(game!=='braid'||winning)return;let l=LEVELS.braid[stage],next=state.mask^(1<<i);if(bitcount(next)>l.k){flash=t('noMore');sfx('blocked');renderStatus();return}state.history.push(state.mask);state.mask=next;state.moves++;flash='';sfx('tap');const b=document.getElementById('board');if(!b)return;const oldMask=state.history[state.history.length-1];
 // The strands now morph smoothly to the new route, rather than jumping between two states.
 b.innerHTML=braidBoard();animateBraid(oldMask,next);
 let perm=braidPermutation(l,next);if(perm.every((id,j)=>id===l.goal[j])){
   state.focus=null;
   document.querySelector('.braid-svg')?.classList.remove('tracing');
   markWin();
  }else renderStatus();let undo=document.querySelector('[data-act="undo"]');if(undo)undo.disabled=false}
function markWin(){if(winning)return;winning=true;let done=progress[game].done;if(!done.includes(stage))done.push(stage);progress[game].unlocked=Math.min(LEVELS[game].length,Math.max(progress[game].unlocked,stage+2));save();sfx('win');let b=document.getElementById('board');if(b&&!b.querySelector('.win-splash'))b.insertAdjacentHTML('beforeend','<div class="win-splash"></div>');let btn=document.querySelector('.ctrl.main');if(btn){btn.style.display='flex';btn.textContent=stage===LEVELS[game].length-1?(locale==='ja'?'すべてクリア':'All cleared'):t('next')+' ›'}let bar=document.querySelector('.bar');if(bar){bar.classList.remove('playing');bar.classList.add('complete')}let resetBtn=document.querySelector('[data-act="reset"]');if(resetBtn)resetBtn.textContent='↺';let undoBtn=document.querySelector('[data-act="undo"]');if(undoBtn)undoBtn.disabled=true;renderStatus()}
function undo(){if(!state.history.length||winning)return;let p=state.history.pop();flash='';if(game==='drift'||game==='gate'){state.pos=p;state.moves=Math.max(0,state.moves-1);document.querySelectorAll('.drift-bead').forEach((el,i)=>{el.style.setProperty('--x',p[i]%5);el.style.setProperty('--y',Math.floor(p[i]/5));el.classList.toggle('at-goal',p[i]===LEVELS[game][stage].goal[i])})}else{state.mask=p;state.moves=Math.max(0,state.moves-1);document.getElementById('board').innerHTML=braidBoard()}sfx('tap');if(game==='gate'){renderGame();return}renderStatus();let el=document.querySelector('[data-act="undo"]');if(el)el.disabled=!state.history.length}
function mainAction(){if(winning){if(stage<LEVELS[game].length-1)start(game,stage+1);else renderHome();return}if(game==='drift'||game==='gate'){note(t('gesture'));return}note(t('toggle'))}
app.addEventListener('click',e=>{let node=e.target.closest('[data-act]');if(node){let a=node.dataset.act;if(a==='sound'){progress.sound=!progress.sound;save();game?renderGame():renderHome()}if(a==='lang'){locale=locale==='ja'?'en':'ja';progress.lang=locale;save();game?renderGame():renderHome()}if(a==='home'){renderHome()}if(a==='enter'){start(node.dataset.game,Math.min(progress[node.dataset.game].unlocked-1,7))}if(a==='undo')undo();if(a==='reset')start(game,stage);if(a==='main')mainAction();return}let sw=e.target.closest('[data-switch]');if(sw&&game==='braid'){braidToggle(Number(sw.dataset.switch));return}let trace=e.target.closest('[data-trace]');if(trace&&game==='braid'&&!winning){const id=Number(trace.dataset.trace);state.focus=state.focus===id?null:id;document.getElementById('board').innerHTML=braidBoard();sfx('tap');}});
document.addEventListener('keydown',e=>{if((game==='drift'||game==='gate')&&['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();driftMove(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key))}else if(game==='braid'&&(e.key==='Enter'||e.key===' ')){let sw=e.target.closest('[data-switch]');if(sw){e.preventDefault();braidToggle(Number(sw.dataset.switch))}else{let trace=e.target.closest('[data-trace]');if(trace){e.preventDefault();const id=Number(trace.dataset.trace);state.focus=state.focus===id?null:id;document.getElementById('board').innerHTML=braidBoard();sfx('tap')}}}});
app.addEventListener('pointerdown',e=>{if((game!=='drift'&&game!=='gate')||winning||!e.target.closest('#drift-zone'))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};e.preventDefault();e.target.setPointerCapture?.(e.pointerId)},{passive:false});
app.addEventListener('pointerup',e=>{if(!pointer||(game!=='drift'&&game!=='gate')||e.pointerId!==pointer.id)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.hypot(dx,dy)<23)return;driftMove(Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0)});
app.addEventListener('pointercancel',()=>{pointer=null});
function selfCheck(){// Check each stored shortest path, goal, and uniqueness at specified minimal toggle budget.
 for(const l of LEVELS.drift){let p=l.start.slice();for(const dir of l.shortest)p=applyDrift(p,DIRS[dir],l.blocks);if(p.join()!==l.goal.join()||l.shortest.length!==l.depth)throw Error('DRIFT invalid stage')}
 for(const l of LEVELS.gate){
  const encode=p=>p.join(',');
  const bfs=(closed=false)=>{let seen=new Map([[encode(l.start),0]]),count=new Map([[encode(l.start),1]]),q=[l.start];for(let i=0;i<q.length;i++){let p=q[i],di=seen.get(encode(p));for(const d of DIRS){let np=applyDrift(p,d,l.blocks,closed?null:l.plate,l.door),key=encode(np);if(key===encode(p))continue;if(!seen.has(key)){seen.set(key,di+1);count.set(key,count.get(encode(p)));q.push(np)}else if(seen.get(key)===di+1){count.set(key,count.get(key)+count.get(encode(p)))}}}return {dist:seen.get(encode(l.goal)),ways:count.get(encode(l.goal))}};
  let open=bfs(false),closed=bfs(true);if(open.dist!==l.depth||open.ways!==l.ways||closed.dist!==undefined)throw Error('GATE invalid stage');
 }
 for(const l of LEVELS.braid){let perm=braidPermutation(l,l.solution);if(perm.join()!==l.goal.join()||bitcount(l.solution)!==l.k)throw Error('BRAID invalid solution');let best=99,count=0;for(let mask=0;mask<(1<<l.pairs.length);mask++)if(braidPermutation(l,mask).join()===l.goal.join()){let c=bitcount(mask);if(c<best){best=c;count=1}else if(c===best)count++}if(best!==l.k||count!==1)throw Error('BRAID non-unique shortest solution')}}
try{selfCheck()}catch(err){console.error(err)}renderHome();
</script></body></html>
