function foldedGeometry(folds){let nx=folds.filter(c=>c==='L'||c==='R').length,ny=folds.length-nx;let w=1/(2**nx),h=1/(2**ny);const scale=156/Math.max(w,h),rw=w*scale,rh=h*scale,x=(278-rw)/2,y=(196-rh)/2;return {x,y,w:rw,h:rh,thickness:2**folds.length}}
function foldedSheetSVG(folds,corner){const q=foldedGeometry(folds);const {x,y,w,h,thickness}=q;let s=`<svg viewBox="0 0 278 196" aria-label="折りたたんだ紙" role="img"><defs><linearGradient id="paper-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6ead9"/><stop offset="1" stop-color="#d6c6b2"/></linearGradient></defs>`;for(let i=Math.min(thickness,4);i>0;i--)s+=`<rect x="${x+i*1.5}" y="${y+i*1.5}" width="${w}" height="${h}" rx="2" fill="${i%2?'#a99681':'#bba994'}" stroke="#f4eadd" stroke-opacity=".18" stroke-width=".7"/>`;s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="url(#paper-gradient)" stroke="#fff4e6" stroke-width="1.3"/>`;if(corner){const left=corner.endsWith('l'),top=corner.startsWith('t'),cx=x+(left?0:w),cy=y+(top?0:h),a=Math.min(w,h)*.4,dx=left?1:-1,dy=top?1:-1;s+=`<path d="M${cx} ${cy+dy*a}L${cx+dx*a} ${cy}" stroke="#ad704d" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M${cx} ${cy}L${cx+dx*a} ${cy}L${cx} ${cy+dy*a}Z" fill="#e5b48b" fill-opacity=".55"/>`}s+='</svg>';return s}
function renderCut(){let l=CUT_LEVELS[stage],s=cutState,k=l.f.length,q=foldedGeometry(s.folds),corners=[['tl',q.x,q.y],['tr',q.x+q.w,q.y],['bl',q.x,q.y+q.h],['br',q.x+q.w,q.y+q.h]];return `<div class="panel cut-target"><div class="goal-art">${cutPaperSvg(l.f.split(''),l.c,'cut-target-'+stage)}</div><div class="goal-copy"><div class="panel-title">THE TARGET</div><div class="goal-big">この形を<br>ひと切りで</div><div class="goal-hint">${k}回折って、角を1回切る。</div></div></div><div class="section-label"><strong>折り ${s.folds.length} / ${k}</strong><small>最後に、切る角をタップ</small></div><div class="panel cut-work"><div class="cut-worktop"><span class="panel-title">YOUR PAPER</span><span class="move-trail">${s.folds.length?s.folds.map(f=>({'L':'左','R':'右','T':'上','B':'下'})[f]).join(' → '):'折る前の紙'}</span></div><div class="cut-board">${foldedSheetSVG(s.folds,s.corner)}${s.folds.length===k?corners.map(([id,x,y])=>`<button class="cut-corner ${s.corner===id?'selected':''}" data-action="cut-corner" data-corner="${id}" style="left:${x/278*100}%;top:${y/196*100}%" aria-label="${({'tl':'左上','tr':'右上','bl':'左下','br':'右下'})[id]}の角を切る">${s.corner===id?'✓':'╱'}</button>`).join(''):''}</div><div class="fold-choices">${[['L','左','→'],['R','右','←'],['T','上','↓'],['B','下','↑']].map(([id,label,arrow])=>`<button class="fold-btn" data-action="cut-fold" data-fold="${id}" ${s.folds.length===k?'disabled':''}><span class="arrow">${arrow}</span><span class="label">${label}から</span></button>`).join('')}</div></div><div class="primary-row"><button class="secondary-btn" data-action="cut-undo" ${!s.folds.length&&!s.corner?'disabled':''}>${SVG.undo} 戻す</button><button class="main-btn" data-action="cut-check" ${s.folds.length!==k||!s.corner?'disabled':''}>${SVG.scissors} 切って開く</button></div>${s.feedback?`<div class="feedback ${s.good?'good':''}">${s.feedback}</div>`:''}${s.result?`<div class="cut-feedback"><div class="cut-compare">${cutPaperSvg(l.f.split(''),l.c,'cut-a-'+stage)}<p>お手本</p></div><div class="cut-compare">${cutPaperSvg(s.result.f,s.result.c,'cut-b-'+stage)}<p>あなたの切り方</p></div></div>`:''}<p class="micro-note">${stage===0?'まずは紙の角を選んで、切ってみよう。':stage<4?'紙はちょうど半分に折る。どちら側を折り返す？':'紙を開いたとき、切れ込みは折り目を中心に鏡映される。'}</p>`}
function setToast(message){const old=document.querySelector('.toast');if(old)old.remove();if(toastTimer)clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2300)}
function queueCelebrate(){const token=completionToken,k=game,num=stage;pendingWin=true;setTimeout(()=>{if(token===completionToken&&game===k&&stage===num&&pendingWin){pendingWin=false;celebrate()}},950)}
function celebrate(){if(won)return;won=true;const k=game;save[k].done=Array.from(new Set([...save[k].done,stage])).sort((a,b)=>a-b);save[k].unlocked=Math.min(GAMES[k].total,Math.max(save[k].unlocked,stage+2));persist();sfx('win');const allDone=save[k].done.length>=GAMES[k].total,finish=allDone&&stage===GAMES[k].total-1;let div=document.createElement('div');div.className='overlay';div.id='win-layer';div.innerHTML=`<div class="win-card"><div class="win-symbol"><div class="win-ring">✦</div></div><div class="win-label">EXPERIMENT COMPLETE</div><h2>${finish?'MASTERED.':'Beautiful.'}</h2><p>${finish?'この実験のすべての問題を解きました。':`問題 ${stage+1} をクリア。いいひらめきでした。`}</p><div class="win-actions">${stage<GAMES[k].total-1?`<button class="main-btn" data-action="next">次の問題 ${SVG.right}</button>`:`<button class="main-btn" data-action="home">実験室にもどる ${SVG.right}</button>`}<button class="secondary-btn" data-action="home">別のゲームを遊ぶ</button><button class="secondary-btn" data-action="retry">もう一度解く</button></div></div>`;document.body.appendChild(div)}
function closeWin(){won=false;pendingWin=false;completionToken++;document.getElementById('win-layer')?.remove()}
function act(action,node){if(action==='home'){closeWin();game=null;home();window.scrollTo(0,0);return}if(action==='sound'){soundOn=!soundOn;game?renderGame():home();if(soundOn)sfx('tap');return}if(action==='enter'){initGame(node.dataset.game);sfx('tap');window.scrollTo(0,0);return}if(action==='stage'){if(game){initGame(game,Number(node.dataset.index));sfx('tap')}return}if(action==='reset'){if(game){initGame(game,stage);sfx('tap')}return}if(action==='next'){const k=game,i=stage+1;closeWin();initGame(k,i);window.scrollTo(0,0);return}if(action==='retry'){const k=game,i=stage;closeWin();initGame(k,i);return}if(action==='review'){reviewOpen=!reviewOpen;renderGame();return}if(action==='copy-review'){const note=root.querySelector('#review-text')?.value||'';const msg=`FOLD & CUT NEXT LAB v1.0\n作品: ${GAMES[game].name}\n問題: ${stage+1}/${GAMES[game].total}\n${note.trim()}`;navigator.clipboard?.writeText(msg).then(()=>setToast('コピーしました。チャットに貼り付けてください。')).catch(()=>setToast('コピーできませんでした。テキストを選択してください。'));return}
if(won||pendingWin)return;
if(game==='layer'){const l=LAYER_LEVELS[stage],s=layerState;if(action==='layer-turn'){const i=Number(node.dataset.i);if(l.lock&&i===0)return;s.turns[i]=(s.turns[i]+Number(node.dataset.d)+4)%4;updateLayerDisc(i);sfx('turn');return}if(action==='layer-check'){const ok=intersect(l,s.turns)===l.target;s.reveal=true;s.good=ok;s.feedback=ok?'ぴったり！ すべての光がそろった。':`まだ違うみたい。光った場所とお手本を見比べてみよう。`;renderGame();if(ok){queueCelebrate()}else{sfx('wrong')}return}}
if(game==='flex'){let s=flexState,l=FLEX_LEVELS[stage],limit=flexLimit(l);if(action==='flex-step'){if(s.history.length>=limit)return;let next=Number(node.dataset.next);if(!FLEX_NODES[s.node].adj.includes(next))return;s.history.push({node:s.node,seen:s.seen});s.node=next;if(FLEX_NODES[next].face===l.seq[s.seen])s.seen++;s.feedback='';s.good=false;sfx('fold');if(s.seen===l.seq.length){s.feedback='ぴったり！ この道順で全部の面が開いた。';s.good=true;renderGame();queueCelebrate();return}if(s.history.length>=limit){s.feedback='手数を使い切ったよ。ひとつ戻して、別の道を試そう。';sfx('wrong')}renderGame();return}if(action==='flex-undo'){const last=s.history.pop();if(last){s.node=last.node;s.seen=last.seen;s.feedback='';sfx('tap');renderGame()}return}}
if(game==='cut'){let s=cutState,l=CUT_LEVELS[stage],k=l.f.length;if(action==='cut-fold'){if(s.folds.length>=k)return;s.folds.push(node.dataset.fold);s.corner=null;s.result=null;s.feedback='';sfx('fold');renderGame();return}if(action==='cut-corner'){if(s.folds.length!==k)return;s.corner=node.dataset.corner;s.result=null;s.feedback='';sfx('tap');renderGame();return}if(action==='cut-undo'){if(s.corner){s.corner=null}else{s.folds.pop()}s.result=null;s.feedback='';sfx('tap');renderGame();return}if(action==='cut-check'){if(s.folds.length!==k||!s.corner)return;const p=cutSignature(cutUnfold(s.folds,s.corner)),expected=cutSignature(cutUnfold(l.f.split(''),l.c));if(p===expected){s.result={f:[...s.folds],c:s.corner};s.feedback='ぴったり！ 紙を開くと、お手本どおり。';s.good=true;sfx('fold');renderGame();queueCelebrate();return}s.result={f:[...s.folds],c:s.corner};s.good=false;s.feedback='切った結果を見比べよう。折る方向や角を変えると、模様も変わる。';sfx('wrong');renderGame();return}}
}
root.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(node){event.preventDefault();act(node.dataset.action,node)}});
document.addEventListener('click',e=>{if(e.target.closest('#win-layer [data-action]')){e.preventDefault();act(e.target.closest('[data-action]').dataset.action,e.target.closest('[data-action]'))}});
let swipe=null;root.addEventListener('pointerdown',e=>{const disc=e.target.closest('[data-swipe-layer]');if(!disc||game!=='layer')return;swipe={id:Number(disc.dataset.swipeLayer),x:e.clientX,y:e.clientY,pointer:e.pointerId};});root.addEventListener('pointerup',e=>{if(!swipe||swipe.pointer!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y,id=swipe.id;swipe=null;if(Math.abs(dx)>=24&&Math.abs(dx)>Math.abs(dy)*1.05){let fake={dataset:{i:String(id),d:dx>0?'1':'-1'}};act('layer-turn',fake)}});root.addEventListener('pointercancel',()=>swipe=null);
// Development checks: all supplied problems are reachable, and layer goal is unique under enabled sheet rotations.
function selfCheck(){for(let [i,l] of LAYER_LEVELS.entries()){let c=0;for(let a=0;a<4;a++)for(let b=0;b<4;b++)for(let d=0;d<(l.masks.length===3?4:1);d++){let t=l.masks.length===3?[a,b,d]:[a,b];if(l.lock&&a!==0)continue;if(intersect(l,t)===l.target)c++}if(c!==1)throw new Error('Layer puzzle not unique: '+(i+1)+' ('+c+')')}for(let [i,l] of CUT_LEVELS.entries()){if(cutSignature(cutUnfold(l.f.split(''),l.c))==='')throw new Error('Cut puzzle invalid '+i)}for(let [i,l] of FLEX_LEVELS.entries()){if(!Number.isFinite(shortestFlex(l.start,l.seq)))throw new Error('Flex puzzle not reachable '+i)}}
try{selfCheck();home()}catch(err){console.error(err);root.innerHTML=`<p style="padding:40px">問題データの検証でエラーが発生しました。${String(err.message)}</p>`}
</script></body></html>
