// HINGE MORPH — unit square panels joined at parent NE ↔ child NW. Delta rotates suffix around joint by 90°.
function qr(x,y,r){for(let t=0;t<((r%4)+4)%4;t++){let v=x;x=-y;y=v}return [x,y]}
function hingeGeom(d){let origin=[0,0],r=0,out=[];for(let i=0;i<=d.length;i++){if(i>0)r=(r+d[i-1])%4;const q=[[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>{let a=qr(x,y,r);return [origin[0]+a[0],origin[1]+a[1]]});const min=[Math.min(...q.map(v=>v[0])),Math.min(...q.map(v=>v[1]))];out.push({r,origin:[...origin],corners:q,cell:min});const v=qr(1,0,r);origin=[origin[0]+v[0],origin[1]+v[1]]}return out}
function hingeLegal(d){let g=hingeGeom(d);return new Set(g.map(o=>o.cell.join(','))).size===g.length}
function hingeMatch(d,goal){const a=hingeGeom(d).map(v=>v.cell.join(',')).sort().join('|'),b=hingeGeom(goal).map(v=>v.cell.join(',')).sort().join('|');return a===b}
function hingeUI(){const l=currentPuzzle(),g=hingeGeom(state.d),gg=hingeGeom(l.goal),all=[...g,...gg];let loX=Math.min(...all.map(o=>o.cell[0])),hiX=Math.max(...all.map(o=>o.cell[0]+1)),loY=Math.min(...all.map(o=>o.cell[1])),hiY=Math.max(...all.map(o=>o.cell[1]+1));const pad=.7;let w=hiX-loX+2*pad,h=hiY-loY+2*pad;let size=Math.max(w,h,4.8);let x=loX-(size-w)/2-pad,y=loY-(size-h)/2-pad;let view=[x,y,size,size].join(' ');let goalSvg=gg.map(a=>`<rect class="hinge-ghost" x="${a.cell[0]+.05}" y="${a.cell[1]+.05}" width=".9" height=".9" rx=".065"/>`).join('');let tiles=g.map((a,i)=>{let pts=a.corners.map(v=>v.join(',')).join(' ');let cx=a.corners.reduce((q,v)=>q+v[0],0)/4,cy=a.corners.reduce((q,v)=>q+v[1],0)/4;return `<g class="hinge-tile ${state.selected===i?'chosen':''}" data-piece="${i}"><polygon class="hinge-square" points="${pts}"/><circle cx="${cx}" cy="${cy}" r=".10" fill="#7eaaa0" opacity=".5"/><text class="hinge-index" x="${cx}" y="${cy}">${i+1}</text>${i>0?`<circle class="hinge-joint" cx="${a.origin[0]}" cy="${a.origin[1]}" r=".10"/>`:''}<polygon class="hinge-touch" points="${pts}"/></g>`}).join('');return `<section class="frame" style="--accent:${META.hinge.color}"><div class="frame-top"><span class="kicker">SHAPE / CHANGE</span><span class="goal-badge">点線の形をつくろう</span></div><div class="board-wrap"><svg class="hinge-svg" id="hinge-board" viewBox="${view}" aria-label="蝶番で連動する紙片。2枚目以降を動かす"><defs><filter id="tileShadow" x="-.4" y="-.4" width="1.8" height="1.8"><feDropShadow dx="0" dy=".045" stdDeviation=".05" flood-color="#07181b" flood-opacity=".24"/></filter></defs>${goalSvg}${tiles}</svg></div><div class="frame-bottom"><div class="hint"><strong style="color:#e0eee1">${state.selected===0?'先頭の紙は固定':`紙片 ${state.selected+1} を選択中`}</strong><br>紙片を動かすと、それより先も一緒に回る。</div><div class="hinge-choices"><button class="hinge-turn" data-act="hinge-turn" data-dir="-1" aria-label="反時計回りに90度" ${state.selected===0?'disabled':''}>↶</button><button class="hinge-turn" data-act="hinge-turn" data-dir="1" aria-label="時計回りに90度" ${state.selected===0?'disabled':''}>↷</button></div></div></section><div class="buttons"><button class="secondary" data-act="hinge-undo">一手戻す</button><button class="primary" data-act="hinge-check">形を確かめる ${icon('right')}</button></div>`}
// FLIP STACK — reversible folding of contiguous panels. Each fold reverses layer order and flips front/back.
function ffold(cols,k,dir){const n=cols.length;if(k<1||k>=n)return null;if(dir==='L'&&k>n-k||dir==='R'&&n-k>k)return null;let d={};let fixed=dir==='L'?Array.from({length:n-k},(_,i)=>k+i):Array.from({length:k},(_,i)=>i);for(const j of fixed)d[j]=cols[j].map(v=>[...v]);let moved=dir==='L'?Array.from({length:k},(_,i)=>i):Array.from({length:n-k},(_,i)=>k+i);for(const j of moved){let target=2*k-1-j;if(!d[target])return null;d[target].push(...cols[j].slice().reverse().map(([id,up])=>[id,up?0:1]))}return Object.keys(d).map(Number).sort((a,b)=>a-b).map(i=>d[i])}
function faceColor(id){return ['#eac5a3','#a9d7cf','#d6c2e9','#eadfa2','#b7cbe9','#e1bac8','#c4dac0','#a8bed1'][id%8]}
function faceChip([id,up],tiny=false){return `<span class="goal-card ${up?'':'back'}" style="--face:${faceColor(id)}" title="${id+1}番の${up?'表':'裏'}">${id+1}<small>${up?'表':'裏'}</small></span>`}
function flipIsSolved(l,cols){return cols.length===1&&cols[0].length===l.target.length&&cols[0].every((v,i)=>v[0]===l.target[i][0]&&v[1]===l.target[i][1])}
function flipUI(){let l=currentPuzzle(),s=state,goal=l.target.slice().reverse().map(a=>faceChip(a)).join('');let current=s.cols.map((pile,col)=>{let t=pile[pile.length-1],depth=pile.length;return `<div class="flip-column" data-col="${col}" aria-label="紙の山 ${col+1}">${depth>2?'<span class="pile-3d more"></span>':''}${depth>1?'<span class="pile-3d"></span>':''}<div class="flip-tile ${t[1]?'':'back'} ${state.selected===col?'selected':''}" style="--face:${faceColor(t[0])}" data-flip-col="${col}" role="button" tabindex="0"><span class="face-index">${t[1]?'FRONT':'BACK'}</span><span class="glyph">${t[0]+1}</span><span class="face-side">${t[1]?'表':'裏'}</span></div>${depth>1?`<div class="pile-depth">${depth} 層</div>`:''}</div>`}).join('<div class="flip-seam"></div>');let choices=[];const n=s.cols.length;for(let k=1;k<n;k++)for(let dir of ['L','R']){if(ffold(s.cols,k,dir))choices.push({k,dir})}let chosen=state.selected,smart=choices.filter(c=>c.dir==='L'?chosen<c.k:chosen>=c.k);let limited=smart.length?smart:choices;const choicesHTML=choices.filter(c=>(c.dir==='L'&&c.k===chosen+1)||(c.dir==='R'&&c.k===chosen)).map(c=>`<button class="fold-choice" data-act="flip-fold" data-k="${c.k}" data-dir="${c.dir}"><span>${c.dir==='L'?'⇥':'⇤'}</span> ${c.dir==='L'?'右へ折る':'左へ折る'}</button>`).join('');let peek=s.peeking?`いまの山（下から） ${s.cols[chosen].map(v=>`${v[0]+1}${v[1]?'表':'裏'}`).join(' · ')}`:'紙をタップすると、その山の中身を見られます';return `<section class="frame" style="--accent:${META.flip.color}"><div class="frame-top"><span class="kicker">FOLD / REVERSE</span><span class="short-rule">${l.n} 枚 → 1つの山へ</span></div><div class="board-wrap"><div class="flip-goal"><div class="flip-goal-label"><span>TARGET · 上からの順番</span><span>表 / 裏</span></div><div class="flip-goal-row">${goal}</div></div><div class="flip-sheet" id="flip-sheet">${current}</div><div class="flip-action-hint">紙を左右にスワイプして折る</div><div class="flip-actions">${choicesHTML||`<div style="grid-column:span 2;text-align:center;color:#a4c8be;font-size:11px;padding:14px 0">${n===1?'1つに重なりました':'折りたい側の端の紙を選ぼう'}</div>`}</div><div class="flip-peek">${peek}</div></div><div class="frame-bottom"><div class="hint">紙は折るたびに裏返り、重なり順も逆になる。</div><span class="count-chip">いま <strong>${n}</strong> 列</span></div></section><div class="buttons"><button class="secondary" data-act="flip-undo">一手戻す</button><button class="primary" data-act="flip-check" ${n!==1?'disabled':''}>重なりを確かめる ${icon('right')}</button></div>`}
const history={hinge:[]};function paperCut(id){let l=currentPuzzle(),s=state;if(s.passed||s.busy)return;const allowed=l.weak.some(e=>edgeId(e)===id);if(!allowed)return;if(s.cut.has(id)){s.cut.delete(id)}else{if(s.cut.size>=l.sol.length){sound('wrong');toast('切れるのは '+l.sol.length+' 本まで');return}s.cut.add(id)}s.reveal=false;sound('cut');render()}
function paperCheck(){let l=currentPuzzle(),s=state;if(s.busy)return;if(s.cut.size!==l.sol.length){toast('あと '+(l.sol.length-s.cut.size)+' 本、切る場所を考えよう');sound('wrong');return}let okay=paperValid(l,s.cut);if(!okay){sound('wrong');app.querySelector('.paper-svg')?.classList.add('shiver');toast('赤がまだつながっているか、青が離れてしまった');return}s.passed=true;s.reveal=true;s.busy=true;render();celebrate(1150)}
function hingeTurn(dir){let l=currentPuzzle(),s=state,j=s.selected-1;if(j<0)return;let d=s.d.slice();d[j]=(d[j]+dir+4)%4;if(!hingeLegal(d)){sound('wrong');app.querySelector('#hinge-board')?.classList.add('buzz');toast('紙が重なってしまう');return}history.hinge.push(s.d.slice());s.d=d;sound('fold');render()}
function hingeCheck(){let l=currentPuzzle();if(hingeMatch(state.d,l.goal)){sound('tick');celebrate(420);app.querySelector('.hinge-svg')?.classList.add('solved')}else{sound('wrong');toast('点線の形と、まだ少し違う')}}
function flipDo(k,dir){let s=state,cols=ffold(s.cols,k,dir);if(!cols){sound('wrong');toast('その折り方では紙がはみ出す');return}if(s.busy)return;s.history.push(s.cols.map(p=>p.map(v=>[...v])));s.busy=true;sound('fold');app.querySelector('.flip-sheet')?.classList.add('is-folding');let all=app.querySelectorAll('.flip-tile');all.forEach(t=>t.classList.add('flip-fold-motion'));const token=animToken;setTimeout(()=>{if(game!=='flip'||state!==s||token!==animToken)return;s.cols=cols;s.selected=Math.min(s.selected,cols.length-1);s.busy=false;s.peeking=false;render();if(cols.length===1&&flipIsSolved(currentPuzzle(),cols))celebrate(740)},390)}
function processAction(act,node){if(act==='sound'){saved.sound=!saved.sound;persist();sound();if(game)render();else home();return}if(act==='home'){animToken++;home();window.scrollTo(0,0);return}if(act==='enter'){start(node.dataset.game);sound();return}if(act==='level'){start(game,Number(node.dataset.i));sound();return}if(act==='next'){start(game,levelIndex+1);return}if(act==='reset'){start(game,levelIndex);sound();return}if(act==='feedback'){feedbackOpen=!feedbackOpen;render();return}if(act==='copy'){let text=`PAPER LAB v2.0\nゲーム：${META[game].name}\n問題：${levelIndex+1}/12\n${app.querySelector('#feed')?.value||''}`;navigator.clipboard?.writeText(text).then(()=>toast('コピーしました')).catch(()=>toast('コピーできませんでした'));return}if(winning||!game)return;
if(game==='paper'){if(act==='paper-undo'){let last=[...state.cut].at(-1);if(last)state.cut.delete(last);sound();render()}if(act==='paper-check')paperCheck();return}
if(game==='hinge'){if(act==='hinge-turn')hingeTurn(Number(node.dataset.dir));if(act==='hinge-undo'){let p=history.hinge.pop();if(p){state.d=p;sound();render()}}if(act==='hinge-check')hingeCheck();return}
if(game==='flip'){if(act==='flip-fold')flipDo(Number(node.dataset.k),node.dataset.dir);if(act==='flip-undo'){let last=state.history.pop();if(last){state.cols=last;state.selected=0;state.peeking=false;sound();render()}}if(act==='flip-check'){if(flipIsSolved(currentPuzzle(),state.cols))celebrate(500);else{sound('wrong');toast('山の順番・表裏が目標と違う')}}}}
document.addEventListener('click',e=>{let node=e.target.closest('[data-act]');if(node){processAction(node.dataset.act,node);return}let seam=e.target.closest('[data-edge]');if(seam&&game==='paper'){paperCut(seam.dataset.edge);return}let p=e.target.closest('[data-piece]');if(p&&game==='hinge'&&!hDrag?.moved){state.selected=Number(p.dataset.piece);render();return}/* flip cards are handled at pointerup to avoid duplicate click toggles */});
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){let seam=e.target.closest('[data-edge]');if(seam){e.preventDefault();paperCut(seam.dataset.edge)}let c=e.target.closest('[data-flip-col]');if(c){e.preventDefault();state.selected=Number(c.dataset.flipCol);state.peeking=!state.peeking;render()}}});
let hDrag=null,flipDrag=null;function svgPoint(svg,x,y){let p=svg.createSVGPoint();p.x=x;p.y=y;let m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):p}
app.addEventListener('pointerdown',e=>{if(winning)return;if(game==='hinge'){let p=e.target.closest('[data-piece]');if(!p)return;let i=Number(p.dataset.piece);if(i<1)return;const svg=app.querySelector('#hinge-board'),g=hingeGeom(state.d),pivot=g[i].origin,pt=svgPoint(svg,e.clientX,e.clientY);hDrag={i,svg,pivot,a0:Math.atan2(pt.y-pivot[1],pt.x-pivot[0]),last:0,moved:false,token:animToken};p.setPointerCapture?.(e.pointerId);e.preventDefault()}
if(game==='flip'){let p=e.target.closest('[data-flip-col]');if(!p)return;flipDrag={col:Number(p.dataset.flipCol),startX:e.clientX,lastX:e.clientX,moved:false,token:animToken};p.setPointerCapture?.(e.pointerId)}});
app.addEventListener('pointermove',e=>{if(hDrag&&game==='hinge'){const d=hDrag,p=svgPoint(d.svg,e.clientX,e.clientY);let da=Math.atan2(Math.sin(Math.atan2(p.y-d.pivot[1],p.x-d.pivot[0])-d.a0),Math.cos(Math.atan2(p.y-d.pivot[1],p.x-d.pivot[0])-d.a0));d.last=da;d.moved||=Math.abs(da)>.16;let angle=da*180/Math.PI;const g=d.svg.querySelectorAll('[data-piece]');g.forEach((el,i)=>{if(i>=d.i)el.setAttribute('transform',`rotate(${angle} ${d.pivot[0]} ${d.pivot[1]})`)});e.preventDefault()}
if(flipDrag&&game==='flip'){flipDrag.lastX=e.clientX;if(Math.abs(e.clientX-flipDrag.startX)>17)flipDrag.moved=true}});
function finishDrag(e){if(hDrag){let d=hDrag;hDrag=null;if(game!=='hinge'||d.token!==animToken)return;let dir=Math.sign(d.last);state.selected=d.i;if(d.moved&&Math.abs(d.last)>.38){let old=state.d.slice();let idx=d.i-1;old[idx]=(old[idx]+dir+4)%4;if(hingeLegal(old)){history.hinge.push(state.d.slice());state.d=old;sound('fold')}else{sound('wrong');toast('紙が重なってしまう')}}render();return}
if(flipDrag){let d=flipDrag;flipDrag=null;if(game!=='flip'||d.token!==animToken)return;state.selected=d.col;let dx=d.lastX-d.startX;if(d.moved&&Math.abs(dx)>36){let dir=dx>0?'L':'R',k=dx>0?d.col+1:d.col;flipDo(k,dir)}else{state.peeking=!state.peeking;render()}return}}
app.addEventListener('pointerup',finishDrag);app.addEventListener('pointercancel',finishDrag);
// Verification: uniqueness of minimum cut; no physical overlap in all hinge targets; all flip targets are fold-reachable.
function verify(){for(const l of DATA.paper){let weak=l.weak.map(edgeId),min=Infinity,count=0;for(let mask=1;mask<1<<weak.length;mask++){let n=0;for(let t=mask;t;t&=t-1)n++;if(n>min)continue;let cut=new Set(weak.filter((_,i)=>mask&(1<<i)));if(paperValid(l,cut)){if(n<min){min=n;count=0}count++}}if(min!==l.sol.length||count!==1)throw Error('Paper uniqueness failure')}
for(const l of DATA.hinge){if(!hingeLegal(l.goal)||hingeMatch(Array(l.n-1).fill(0),l.goal))throw Error('Hinge invalid goal')}
for(const l of DATA.flip){const start=Array.from({length:l.n},(_,id)=>[[id,1]]),q=[start],seen=new Set([JSON.stringify(start)]);let hit=false;for(let j=0;j<q.length;j++){let s=q[j];if(flipIsSolved(l,s)){hit=true;break}for(let k=1;k<s.length;k++)for(let dir of ['L','R']){let n=ffold(s,k,dir),key=JSON.stringify(n);if(n&&!seen.has(key)){seen.add(key);q.push(n)}}}if(!hit)throw Error('Flip unreachable')}}
try{verify();window.__LAB_CHECKS__='PASS'}catch(e){window.__LAB_CHECKS__=String(e);console.error(e)}
home();
</script></body></html>
