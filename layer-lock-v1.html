     if(game!=='flex'||flexState!==s)return;
     s.history.push({node:s.node,seen:s.seen});
     s.node=next;
     if(FLEX_NODES[next].face===l.seq[s.seen])s.seen++;
     s.feedback='';s.good=false;s.animating=false;
     if(s.seen===l.seq.length){s.feedback='目標の面をすべて開いた。';s.good=true;renderGame();queueCelebrate();return}
     if(s.history.length>=limit){s.feedback='残り手数がなくなった。戻して別の道を探そう。';sfx('wrong')}
     renderGame();
   },260);
   return;
 }
 if(action==='flex-undo'){
   if(s.animating)return;
   const last=s.history.pop();
   if(last){s.node=last.node;s.seen=last.seen;s.feedback='';sfx('tap');renderGame()}
   return;
 }
}

}
root.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(node){event.preventDefault();act(node.dataset.action,node)}});
document.addEventListener('click',e=>{if(e.target.closest('#win-layer [data-action]')){e.preventDefault();act(e.target.closest('[data-action]').dataset.action,e.target.closest('[data-action]'))}});
let swipe=null;root.addEventListener('pointerdown',e=>{const disc=e.target.closest('[data-swipe-layer]');if(!disc||game!=='layer')return;swipe={id:Number(disc.dataset.swipeLayer),x:e.clientX,y:e.clientY,pointer:e.pointerId};});root.addEventListener('pointerup',e=>{if(!swipe||swipe.pointer!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y,id=swipe.id;swipe=null;if(Math.abs(dx)>=24&&Math.abs(dx)>Math.abs(dy)*1.05){let fake={dataset:{i:String(id),d:dx>0?'1':'-1'}};act('layer-turn',fake)}});root.addEventListener('pointercancel',()=>swipe=null);
// Development checks: all supplied problems are reachable, and layer goal is unique under enabled sheet rotations.
function selfCheck(){for(let [i,l] of LAYER_LEVELS.entries()){let c=0;for(let a=0;a<4;a++)for(let b=0;b<4;b++)for(let d=0;d<(l.masks.length===3?4:1);d++){let t=l.masks.length===3?[a,b,d]:[a,b];if(l.lock&&a!==0)continue;if(intersect(l,t)===l.target)c++}if(c!==1)throw new Error('Layer puzzle not unique: '+(i+1)+' ('+c+')')}for(let [i,l] of FLEX_LEVELS.entries()){if(!Number.isFinite(shortestFlex(l.start,l.seq)))throw new Error('Flex puzzle not reachable '+i)}}
try{selfCheck();home()}catch(err){console.error(err);root.innerHTML=`<p style="padding:40px">問題データの検証でエラーが発生しました。${String(err.message)}</p>`}
